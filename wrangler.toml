# Cloudflare Workers + Static Assets config for the Splitea
# web client. The Vite build emits the SPA into `dist/`; the
# Worker serves those files with SPA-routing fallback (any path
# the assets bundle doesn't match returns `index.html`).
#
# Pairs with the existing splitea-shares worker:
#  - splitea-shares owns: /r/<id>, /live/*, /.well-known/*, favicons
#  - splitea-web owns:  everything else under splitea.app
#
# Cloudflare's route-precedence model means specific worker
# routes win — the splitea-shares routes keep working unchanged
# even when this worker is bound to splitea.app/*.
#
# Deploy prod: `npx wrangler deploy`            → splitea-web      @ splitea.app/*
# Deploy dev:  `npx wrangler deploy --env dev`  → splitea-web-dev  @ dev.splitea.app/*
# Develop:     `npm run dev`  (Vite dev server, no Worker)

name = "splitea-web"
compatibility_date = "2025-04-01"

# Disable the auto-generated `*.workers.dev` URL — splitea.app
# is the only public surface we want. Cloudflare warns when
# this isn't explicitly set; setting it false silences the
# warning AND keeps the worker private outside its custom
# routes.
workers_dev = false
preview_urls = false

main = "worker/index.js"

# Custom-domain routing. NOTE: `routes` MUST be declared at
# the TOML top level, not under `[assets]`. Putting it after
# the `[assets]` table header would scope it as `assets.routes`
# (which Wrangler then warns about as "unexpected field").
#
# `routes` is non-inheritable, so this prod-only list does NOT
# carry into `[env.dev]` — the dev worker declares its own
# `dev.splitea.app/*` route below.
routes = [
  { pattern = "splitea.app/*", zone_name = "splitea.app" },
]

# Static-assets worker. Vite's `dist/` directory is what
# Cloudflare serves. Worker code runs only for the landing
# videos (`run_worker_first`), to answer the byte-range
# requests Safari needs before it will play an MP4; every other
# path is served straight from the assets.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/landing/*.mp4"]
# `404-page` serves dist/404.html (the bare SPA shell, marked
# noindex) with a real 404 status for unknown paths. The router
# still renders NotFound there, and "/" keeps its prerendered
# index.html.
not_found_handling = "404-page"

# Dev environment. `wrangler deploy --env dev` ships a separate
# worker (`splitea-web-dev`) bound to `dev.splitea.app/*`,
# isolating dev deploys from prod — the same split the
# `splitea-shares` worker uses. The splitea-shares-dev worker
# owns the specific paths under dev.splitea.app
# (`/r/*`, `/live/*`, etc.); this catchall serves the SPA for
# everything else, mirroring the prod layering on `splitea.app`.
#
# `routes` and `assets` are non-inheritable, so both are
# redeclared here rather than picked up from the top level.
[env.dev]
name = "splitea-web-dev"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "dev.splitea.app/*", zone_name = "splitea.app" },
]

[env.dev.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/landing/*.mp4"]
not_found_handling = "404-page"
